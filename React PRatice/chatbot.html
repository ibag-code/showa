<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>


    <style>
        /* body {
          display: flex;
          flex-direction: column;
          height: 100vh;
          justify-content: center;
          align-items: center;
        }  */

        body {
            font-family: 'Courier New', Courier, monospace;
            margin : 0px;
        }


        .app-container {
          max-width: 800px;
          margin-left: auto;
          margin-right: auto;

          height: 100vh;
          overflow: hidden;

          display: flex;
          flex-direction: column;
          flex-grow: auto ;
         }

        .chat-container {
          display: flex;
          margin-bottom: 60px;
        }

        .both-chat-container {
          flex-grow: 1;
          overflow: scroll; 
          scrollbar-width: none ;
          margin-bottom: 40px;
        }
        

        .send-button {
          background-color: rgb(1, 1, 156);
          border: 0px;
          color: white;
          width: 100px;
          height: 50px;
          border-radius: 30px;
          padding: 4px 12px;
          font-size: 16px;
          font-weight: 300;
        }

        .input-field {
          border-radius: 4px;
          height: 40px;
          width: 100%;
          border: 1px solid grey;
          padding: 4px 12px;
          margin-right: 12px;
          border-radius: 99px;
          font-size: 16px;
          flex-grow: 1;
          font-family: 'Courier New', Courier, monospace;

        }

        .chat-user {
          display: flex;
          justify-content: flex-end;
          margin-top: 40px;
          gap: 18px;
        }

        .robot-img {
          height: 50px;
          width: 50px;
          margin-bottom: 20px;
        }

        .user-img  {
          height: 50px;
          width: 50px;
        }


        .chat-text {
          background-color: rgb(238, 238, 238);
          align-items: center;
          justify-content: center;
          display: flex;
          align-items: center;
          padding: 8px 16px;
          border-radius: 6px;

          font-size: 18px;
          max-width: 500px;
        }

        .chat-robot {
          display: flex;
          justify-content: flex-start;
          gap: 18px;
          margin-top: 40px;

        }
    </style>
  </head>
  <body>
 

    <div class="js-container"></div>


    <script src="https://unpkg.com/supersimpledev/react.js"></script>

    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>


    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>





    <script src="https://unpkg.com/supersimpledev/babel.js"></script>



    <script type="text/babel">   

    //Input Component
    function ChatInput({ chatMessages, setChatMessages, setIsLoading }) {
      
      const [inputText, setInputText] = React.useState("");
      // const inputText = theInputTextArray[0];
      // const setInputText = theInputTextArray[1];


 
      function saveInputText (event) {
        setInputText (event.target.value)
      } 



     async function sendMessage () {
      if (inputText.trim() === '') {
        return;
      }

        const newChatMessages =  [
            ...chatMessages,
          {
            id: crypto.randomUUID(),
            message: inputText ,
            sender: "user"
          }
        ]

        setChatMessages(newChatMessages)
        setIsLoading(true);





        const botResponce = await Chatbot.getResponseAsync(inputText)

        setChatMessages([
            ...newChatMessages,
          {
            id: crypto.randomUUID(),
            message: botResponce ,
            sender: "robot"
          }
        ])

        setIsLoading(false) 
        setInputText('');
      }

  
      function TheEnter (event) {
        if (event.key ==="Enter") {
          sendMessage()
          setInputText('')
        }

        if (event.key === "Escape") {
            // alert("Escape text")
            setInputText('');

            ;
        }
      }


       return (
        <div className="chat-container">
          <input 
            className = "input-field "
            type="text" 
            placeholder="Send a message to Chatbot"  
            size= "50" 
            onChange={saveInputText }
            onKeyDown = {TheEnter}
            value = {inputText}  //controlled input
            
          />
            <button 
            onClick = {sendMessage}
            className = "send-button"
            > 
            Send </button>
        </div>
       );
    }




    //Chat Component
    function ChatMessage (props) {
       console.log(props)
      const message = props.message;
      const sender = props.sender;
     
      

      return (
        <div className={
          sender==="user" 
          ? "chat-user" 
          : "chat-robot" 
        }> 

            {sender === "robot" && 
            <img  className="robot-img"  
                  src="robot.png" 
                  alt="user image" 
                   /> }

            <div className="chat-text">
              {message}
            </div>
            

            {sender === "user" &&  
            <img  className="user-img"
                  src="user.png" 
                  alt="user image" 
                  />  }


        </div> 
      );
    }    
     
    

    //MVC component
    function ChatMessageFrame ({ chatMessages, isLoading}) {

      const chatMessagesRef = React.useRef(null);

      //Run some code after MVC component code run
       React.useEffect(() => {

       const containerELem = chatMessagesRef.current;
       if (containerELem) {
        containerELem.scrollTop =  containerELem.scrollHeight;
       }

       },[chatMessages])
          
      return(

        <div className="both-chat-container"
              ref = {chatMessagesRef}
        > 

          {chatMessages.map((chatMessage) => {
              return (

                <ChatMessage 
                  key = {chatMessage.id}
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                />
              );
          })}

          {isLoading && <div>Loading...</div>}
        </div>
      )

    }




    
    function AppDisplay() {
            
          //Converting the data into state
      const [chatMessages, setChatMessages] = React.useState(
        [{
            id: 'id1',
            message: "Hello ChatBot",
            sender: "user"
          },
          {
            id: 'id2',
            message: "Hello! how can i help you?",
            sender: "robot"
          }, 
          {
            id: 'id3',
            message: "Can you get me todays day",
            sender: "user"
          }, 
          {
            id: 'id4',
            message: "Today is September 9",
            sender: "robot"
          }
        ]);


        //Loading State 
      const [isLoading, setIsLoading] = React.useState(false)

        return (
          <div className ="app-container">  


              <ChatMessageFrame 
              chatMessages={chatMessages}
              isLoading={isLoading}  
               />


              <ChatInput 
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
              setIsLoading={setIsLoading} 
              />
          </div>
        ) 

       }

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);

      root.render(<AppDisplay />);
    </script>


  </body>
</html>
