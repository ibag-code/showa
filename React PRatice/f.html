    /* shell */
    .shell{display:flex;min-height:100vh}.sidebar{width:246px;background:#fff;border-right:1px solid var(--line);padding:27px 15px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:5}.sidebar .logo{padding:0 13px 35px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#a197a5;font-weight:800;padding:16px 14px 8px}.nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;color:#736b77;border-radius:8px;margin:2px 0;cursor:pointer}.nav-item:hover,.nav-item.active{background:var(--lav);color:var(--purple);font-weight:700}.nav-icon{width:18px;text-align:center;color:inherit}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}.main{margin-left:246px;width:calc(100% - 246px)}.topbar{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px}.crumb{color:var(--muted)}.top-actions{display:flex;align-items:center;gap:20px}.icon-btn{font-size:18px;color:#776c7b;background:transparent;position:relative}.dot{width:6px;height:6px;border-radius:50%;background:#cc5b5b;position:absolute;right:0;top:0}.user-mini{display:flex;align-items:center;gap:9px;font-weight:700}.user-avatar{height:34px;width:34px;border-radius:50%;background:#d6ad9a;color:#583e31;display:grid;place-items:center;font-size:11px}.content{padding:34px 40px 60px;max-width:1320px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}.page-head h1{font-size:30px;margin:5px 0 8px}.page-head p{color:var(--muted);margin:0}.card{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 12px #30203406}.grid{display:grid;gap:18px}.grid-2{grid-template-columns:1.32fr .8fr}.grid-3{grid-template-columns:repeat(3,1fr)}.card-pad{padding:22px}.section-title{font-size:15px;margin:0 0 17px}.progress-track{height:7px;background:#eee8f0;border-radius:6px;overflow:hidden}.progress-value{height:10  0;font-size:13px}.rating{color:#d89723;letter-spacing:2px}
    /* inner pages */
    .filterbar{display:flex;gap:10px;margin-bottom:22px}.search{flex:1;position:relative}.search input{width:100%;padding:13px 14px 13px 38px;border:1px solid var(--line);border-radius:8px}.search span{position:absolute;left:14px;top:12px;color:var(--muted)}.select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 12px;color:var(--muted)}.project-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.feed-card{padding:20px}.feed-card h3{margin:8px 0;font-size:16px}.feed-card .meta{color:var(--muted);font-size:12px;display:flex;gap:13px}.feed-card .budget{font-weight:800;font-size:16px;margin:18px 0 15px}.feed-actions{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:15px}.detail-layout{display:grid;grid-template-columns:1.45fr .7fr;gap:22px}.detail-hero{height:210px;background:linear-gradient(130deg,#a88cac,#47374b);border-radius:11px 11px 0 0;position:relative}.detail-body{padding:26px}.detail-body h1{font-size:28px;margin:8px 0}.detail-body p{line-height:1.7;color:var(--muted)}.detail-side{padding:22px;align-self:start}.side-price{font:800 25px Manrope;margin:9px 0 20px}.side-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.side-row span:last-child{font-weight:700}.stepper{display:flex;align-items:center;max-width:680px;margin:0 0 35px}.step{display:flex;align-items:center;gap:8px;color:#a59aa8;white-space:nowrap}.step.active{color:var(--purple);font-weight:700}.step-num{width:28px;height:28px;border:1px solid #d8cedc;border-radius:50%;display:grid;place-items:center}.step.active .step-num{background:var(--purple);color:white;border-color:var(--purple)}.step-line{height:1px;background:var(--line);width:70px;margin:0 12px}.form-card{padding:28px;max-width:760px}.check-grid{display:flex;flex-wrap:wrap;gap:10px}.check{padding:11px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer}.check.on{color:var(--purple);border-color:var(--purple);background:var(--lav)}.form-actions{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:30px;padding-top:20px}.success{max-width:650px;margin:80px auto;text-align:center}.success-mark{width:62px;height:62px;background:#e4f5ee;color:var(--green);border-radius:50%;display:grid;place-items:center;font-size:30px;margin:auto}.success h1{font-size:30px}.success p{color:var(--muted);line-height:1.7}.chat-layout{display:grid;grid-template-columns:290px 1fr;min-height:575px}.chat-list{border-right:1px solid var(--line)}.chat-list .list-row{padding:17px 20px}.chat-list .selected{background:var(--lav)}.chat-window{display:flex;flex-direction:column}.chat-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.chat-messages{padding:25px;flex:1;display:flex;flex-direction:column;gap:14px}.bubble{padding:12px 15px;border-radius:12px;background:#f2edf3;max-width:65%;align-self:flex-start;color:#554958}.bubble.mine{background:var(--purple);color:white;align-self:flex-end}.chat-input{padding:14px;border-top:1px solid var(--line);display:flex;gap:10px}.chat-input input{flex:1;border:1px solid var(--line);border-radius:8px;padding:12px}.timeline{border-left:2px solid #e2d6e6;padding-left:22px}.timeline-item{position:relative;margin-bottom:23px}.timeline-item:before{content:'';position:absolute;left:-29px;top:3px;width:10px;height:10px;background:var(--purple);border:3px solid #eee5f0;border-radius:50%}.timeline-item strong{display:block}.timeline-item small{color:var(--muted)}
    @media(max-width:900px){.hero{grid-template-columns:1fr}.hero-visual{display:none}.auth{grid-template-columns:1fr}.auth-side{display:none}.sidebar{width:70px;padding:20px 8px}.sidebar .logo{padding:0 13px 30px}.sidebar .logo span,.nav-item span:not(.nav-icon),.nav-label,.sidebar-bottom .nav-item span:not(.nav-icon){display:none}.main{margin-left:70px;width:calc(100% - 70px)}.content{padding:25px 20px}.grid-2,.detail-layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.project-grid{grid-template-columns:1fr}.landing-nav .links{display:none}}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;
const Icon = ({children}) => <span className="nav-icon">{children}</span>;
const Logo = () => <div className="logo"><span className="logo-mark">C</span><span>craft</span></div>;
const Button = ({children,kind="primary",onClick,type="button"}) => <button type={type} onClick={onClick} className={`btn btn-${kind}`}>{children}</button>;

function Landing({go}) {
  return <div className="landing">
    <nav className="landing-nav"><Logo/><div className="links"><a className="link" onClick={()=>go('projects')}>Explore projects</a><a className="link" onClick={()=>go('login')}>Log in</a><Button kind="primary" onClick={()=>go('signup')}>Join Craft <span>↗</span></Button></div></nav>
    <main className="hero"><div><div className="eyebrow">The professional network for builders</div><h1>More work.<br/><span style={{color:'var(--purple)'}}>Built around you.</span></h1><p>Craft connects skilled artisans with quality construction projects, fair opportunities and clients who value the work you do.</p><div className="hero-actions"><Button onClick={()=>go('signup')}>Create your profile <span>→</span></Button><Button kind="secondary" onClick={()=>go('projects')}>Explore projects</Button></div><div className="hero-note"><span>✓</span> Join 12,000+ verified artisans growing with Craft</div></div>
      <div className="hero-visual"><div className="blueprint"><div className="eyebrow">Your Craft profile</div><strong>Samuel Adeyemi</strong><div className="muted">Master electrician</div><div className="blueprint-line"></div><div className="blueprint-line short"></div><div style={{marginTop:16}}><span className="tag green">Verified</span><span className="tag">4.9 ★</span></div></div><div className="hero-image"></div><div className="trust-card"><div className="eyebrow">Built on trust</div><strong>Quality work, recognised</strong><div className="avatars"><div className="avatar">AD</div><div className="avatar">FN</div><div className="avatar">KO</div><div className="avatar">+12k</div></div></div></div>
    </main><div className="feature-row"><div><span className="feature-icon">↗</span><span>Projects that match your skills</span></div><div><span className="feature-icon">₦</span><span>Clear scope and secure payments</span></div><div><span className="feature-icon">★</span><span>Reputation that travels with you</span></div></div>
  </div>
}

function Auth({mode,go}) {
  const [account,setAccount]=useState('artisan'); const [email,setEmail]=useState('');
  if(mode==='signup') return <div className="auth"><div className="auth-side"><Logo/><div><div className="eyebrow" style={{color:'#e5cfee'}}>Start your next chapter</div><h1>Your best work deserves a better stage.</h1><p>Create one profile, find the right projects and let your reputation do the talking.</p></div><div className="quote">“Craft helped me move from word-of-mouth to a full pipeline of work.”<br/><b style={{display:'block',marginTop:8}}>— Amina Yusuf, tiler</b></div></div><div className="auth-form"><div className="eyebrow">Step 1 of 2</div><h2>Create your Craft account</h2><p className="form-help">Tell us how you’ll use Craft. You can update this later.</p><div className="choice-grid"><button className={`choice ${account==='artisan'?'selected':''}`} onClick={()=>setAccount('artisan')}><div className="choice-icon">⌂</div><strong>I'm an artisan</strong><p className="muted">Find work, grow your profile and get paid.</p></button><button className={`choice ${account==='client'?'selected':''}`} onClick={()=>setAccount('client')}><div className="choice-icon">▦</div><strong>I'm a client</strong><p className="muted">Find skilled people for a project.</p></button></div><div className="field"><label>Full name</label><input placeholder="e.g. Samuel Adeyemi"/></div><div className="field"><label>Email address</label><input value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com"/></div><Button onClick={()=>go('verify')}>Continue <span>→</span></Button><div className="auth-footer">Already have an account? <a onClick={()=>go('login')}>Log in</a></div></div></div>;
  return <div className="auth"><div className="auth-side"><Logo/><div><div className="eyebrow" style={{color:'#e5cfee'}}>Welcome back</div><h1>Good work starts with the right connection.</h1><p>Pick up where you left off and keep building your Craft reputation.</p></div><div className="quote">Your profile, projects and payments — all in one place.</div></div><div className="auth-form"><div className="eyebrow">Artisan access</div><h2>Log in to Craft</h2><p className="form-help">Welcome back. Your next opportunity may be waiting.</p><div className="field"><label>Email address</label><input placeholder="you@example.com"/></div><div className="field"><label>Password <a className="link" style={{float:'right'}} onClick={()=>go('forgot')}>Forgot password?</a></label><input type="password" placeholder="Enter your password"/></div><Button onClick={()=>go('dashboard')}>Log in <span>→</span></Button><div className="auth-footer">New to Craft? <a onClick={()=>go('signup')}>Create an account</a></div></div></div>
}

function Verify({go}) { return <div className="auth"><div className="auth-side"><Logo/><div><div className="eyebrow" style={{color:'#e5cfee'}}>One last step</div><h1>Make your profile easy to trust.</h1><p>A verified account gets more visibility with clients and unlocks every Craft feature.</p></div><div className="quote">We keep your information private and secure.</div></div><div className="auth-form"><div className="eyebrow">Step 2 of 2</div><h2>Verify your email</h2><p className="form-help">We sent a 6-digit code to <b>samuel@example.com</b>.</p><div style={{display:'flex',gap:10,margin:'28px 0'}}>{[1,2,3,4,5,6].map(i=><input key={i} style={{width:48,height:52,textAlign:'center',fontSize:20,border:'1px solid #dcd4df',borderRadius:8}} maxLength="1"/>)}</div><Button onClick={()=>go('onboarding')}>Verify and continue <span>→</span></Button><div className="auth-footer"><a className="link" onClick={()=>go('signup')}>Change email</a> · <a className="link">Resend code</a></div></div></div> }

const navGroups=[['WORKSPACE',['Dashboard','Project Feed','Applications','Messages']],['YOUR CRAFT',['My Profile','Portfolio','Reviews','Payments']],['ACCOUNT',['Settings']]];
function Shell({page,setPage,children}) { return <div className="shell"><aside className="sidebar"><Logo/>{navGroups.map(([label,items])=><div key={label}><div className="nav-label">{label}</div>{items.map((item,i)=><div key={item} className={`nav-item ${page===item.toLowerCase().replace(' ','-')?'active':''}`} onClick={()=>setPage(item.toLowerCase().replace(' ','-'))}><Icon>{['⌂','⌕','▤','◌','◎','▧','★','₦','⚙'][navGroups.flatMap(x=>x[1]).indexOf(item)]}</Icon><span>{item}</span>{item==='Messages'&&<span style={{marginLeft:'auto',background:'#eab7bd',color:'#8e454d',borderRadius:10,fontSize:10,padding:'2px 6px'}}>3</span>}</div>)}</div>)}<div className="sidebar-bottom"><div className="nav-item" onClick={()=>setPage('landing')}><Icon>↪</Icon><span>Sign out</span></div></div></aside><div className="main"><header className="topbar"><span className="crumb">Workspace <span style={{margin:'0 8px'}}>›</span> <b style={{color:'var(--ink)'}}>{page.replace('-', ' ')}</b></span><div className="top-actions"><button className="icon-btn" onClick={()=>setPage('messages')}>♧<span className="dot"></span></button><div className="user-mini" onClick={()=>setPage('my-profile')} style={{cursor:'pointer'}}><div className="user-avatar">SA</div><span>Samuel Adeyemi</span><span className="muted">⌄</span></div></div></header><main className="content">{children}</main></div></div> }

function ProfileEdit({setPage}) { return <><div className="page-head"><div><a className="link" onClick={()=>setPage('my-profile')}>← Back to profile</a><h1 style={{marginTop:18}}>Edit profile</h1><p>Make your experience easy for the right client to understand.</p></div></div><div className="card form-card"><div className="field"><label>Profile photo</label><div style={{display:'flex',gap:15,alignItems:'center'}}><div className="user-avatar" style={{width:62,height:62,fontSize:18}}>SA</div><Button kind="secondary">Change photo</Button></div></div><div className="form-row"><div className="field"><label>Full name</label><input defaultValue="Samuel Adeyemi"/></div><div className="field"><label>Primary trade</label><select><option>Electrical</option><option>Plumbing</option></select></div></div><div className="field"><label>Professional bio</label><textarea rows="5" defaultValue="I’m a detail-oriented electrician with 8 years of experience in residential and commercial installations."></textarea></div><div className="field"><label>Service area</label><input defaultValue="Lagos Mainland · Lagos Island · Lekki"/></div><div className="field"><label>Pricing preference</label><div className="check-grid"><div className="check on">Discuss per project</div><div className="check">Fixed rates</div><div className="check">Hourly rate</div></div></div><div className="form-actions"><Button kind="ghost" onClick={()=>setPage('my-profile')}>Cancel</Button><Button onClick={()=>setPage('my-profile')}>Save profile <span>✓</span></Button></div></div></> }

function Onboarding({setPage}) { const [step,setStep]=useState(1); const [selected,setSelected]=useState([]); const steps=['Trade','Skills','Location','Experience','Preferences','Availability','Alerts','Portfolio']; const toggle=x=>setSelected(selected.includes(x)?selected.filter(y=>y!==x):[...selected,x]); if(step===9)return <div className="card success"><div className="success-mark">✓</div><div className="eyebrow" style={{marginTop:22}}>You’re ready to build</div><h1>Welcome to Craft, Samuel.</h1><p>Your profile is live. We’ll use your skills and preferences to bring you the right opportunities.</p><div style={{display:'flex',justifyContent:'center',gap:10,marginTop:24}}><Button onClick={()=>setPage('dashboard')}>Go to dashboard →</Button><Button kind="secondary" onClick={()=>setPage('project-feed')}>Explore projects</Button></div></div>; return <><div style={{maxWidth:820,margin:'0 auto'}}><div className="eyebrow">Set up your profile · Step {step} of 8</div><h1 style={{fontSize:32,margin:'8px 0 28px'}}>Let’s make your work discoverable.</h1><div className="stepper" style={{maxWidth:'100%',overflow:'hidden'}}>{steps.map((x,i)=><React.Fragment key={x}><div className={`step ${step>=i+1?'active':''}`}><span className="step-num">{step>i+1?'✓':i+1}</span><span className="step-label">{x}</span></div>{i<7&&<div className="step-line"></div>}</React.Fragment>)}</div><div className="card form-card" style={{maxWidth:'100%'}}>{step===1&&<><h2>What’s your primary trade?</h2><p className="form-help">Choose the trade clients should find you for first.</p><div className="check-grid">{['Electrician','Plumber','Mason / Bricklayer','Painter','Carpenter','Tiler','Welder','Roofer'].map(x=><div onClick={()=>toggle(x)} className={`check ${selected.includes(x)?'on':''}`} key={x}>{selected.includes(x)?'✓ ':''}{x}</div>)}</div></>}{step===2&&<><h2>Which services do you offer?</h2><p className="form-help">Select all that apply. You can add more later.</p><div className="check-grid">{['Residential wiring','Commercial wiring','Lighting installation','Solar installation','Fault finding','Smart home systems','Electrical safety checks'].map(x=><div onClick={()=>toggle(x)} className={`check ${selected.includes(x)?'on':''}`} key={x}>{selected.includes(x)?'✓ ':''}{x}</div>)}</div></>}{step===3&&<><h2>Where do you work?</h2><p className="form-help">We’ll show you opportunities within a realistic travel distance.</p><div className="field"><label>Base location</label><input placeholder="Search your city or area" defaultValue="Lagos, Nigeria"/></div><div className="field"><label>Service radius</label><select><option>Within 15 km</option><option>Within 30 km</option><option>Anywhere in Lagos</option></select></div></>}{step===4&&<><h2>How much experience do you have?</h2><p className="form-help">This helps clients find the right level of expertise.</p><div className="check-grid">{['Just starting out','1–2 years','3–5 years','6–10 years','10+ years'].map(x=><div onClick={()=>toggle(x)} className={`check ${selected.includes(x)?'on':''}`} key={x}>{x}</div>)}</div></>}{step===5&&<><h2>What kind of projects interest you?</h2><p className="form-help">We’ll tune your recommendations around this.</p><div className="check-grid">{['Residential homes','Commercial spaces','Renovations','New builds','Maintenance & repairs','Large-scale projects'].map(x=><div onClick={()=>toggle(x)} className={`check ${selected.includes(x)?'on':''}`} key={x}>{selected.includes(x)?'✓ ':''}{x}</div>)}</div></>}{step===6&&<><h2>When are you available?</h2><p className="form-help">Clients value a quick, clear answer.</p><div className="check-grid"><div className="check on">✓ Available for new work</div><div className="check">Booked for the next 2 weeks</div></div><div className="field"><label>Typical working hours</label><input defaultValue="Mon–Sat · 8:00 AM – 5:00 PM"/></div></>}{step===7&&<><h2>How should we alert you?</h2><p className="form-help">Choose how Craft keeps you in the loop.</p><div className="list"><div className="list-row"><span><b>Matched projects</b><br/><small className="muted">Get a daily digest of relevant opportunities.</small></span><input type="checkbox" defaultChecked/></div><div className="list-row"><span><b>Client messages</b><br/><small className="muted">Never miss a question or invite.</small></span><input type="checkbox" defaultChecked/></div><div className="list-row"><span><b>Application updates</b><br/><small className="muted">Know when a client views or responds.</small></span><input type="checkbox" defaultChecked/></div></div></>}{step===8&&<><h2>Show clients your best work</h2><p className="form-help">You can upload projects now or do it from your dashboard.</p><div style={{border:'1px dashed #cfc1d4',borderRadius:10,padding:35,textAlign:'center',background:'#fcf9fd'}}><div style={{fontSize:27,color:'var(--purple)'}}>▧</div><b>Add your first project</b><p className="muted">A clear photo and short description is all you need.</p><Button kind="secondary" onClick={()=>setPage('portfolio-add')}>Upload work</Button></div><p className="muted" style={{textAlign:'center',marginTop:20}}>You can also <a className="link" onClick={()=>setStep(9)}>skip for now</a></p></>}{step<8&&<div className="form-actions"><Button kind="ghost" onClick={()=>step===1?setPage('landing'):setStep(step-1)}>← Back</Button><Button onClick={()=>setStep(step+1)}>Save & continue <span>→</span></Button></div>}{step===8&&<div className="form-actions"><Button kind="ghost" onClick={()=>setStep(7)}>← Back</Button><Button onClick={()=>setStep(9)}>Finish setup <span>→</span></Button></div>}</div></div></> }

function Reviews({setPage}) { return <><div className="page-head"><div><div className="eyebrow">Trust that compounds</div><h1>Reviews & reputation</h1><p>Every great project makes the next one easier to win.</p></div><Button kind="secondary" onClick={()=>setPage('my-profile')}>View public profile →</Button></div><div className="grid grid-2"><div className="card card-pad"><div style={{display:'flex',alignItems:'center',gap:20,paddingBottom:22,borderBottom:'1px solid var(--line)'}}><div style={{font:'800 46px Manrope',color:'var(--purple)'}}>4.9</div><div><div className="rating">★★★★★</div><div className="muted" style={{marginTop:5}}>Based on 18 reviews</div></div></div>{[['5 stars','16',89],['4 stars','2',11],['3 stars','0',0],['2 stars','0',0]].map(x=><div className="summary-line" key={x[0]}><span style={{width:60}}>{x[0]}</span><div className="progress-track" style={{flex:1,margin:'4px 15px'}}><div className="progress-value" style={{width:x[2]+'%'}}></div></div><span>{x[1]}</span></div>)}</div><div className="card card-pad"><div className="eyebrow">Your trust signals</div><div className="list" style={{marginTop:10}}>{[['Verified identity','Your clients know you are real','✓'],['Top-rated artisan','You’re in the top 10% in Electrical','★'],['Reliable responder','You reply to 95% of messages','↗']].map(x=><div className="list-row" key={x[0]}><div className="message-row"><div className="feature-icon">{x[2]}</div><div><strong>{x[0]}</strong><small>{x[1]}</small></div></div></div>)}</div></div></div><div className="card card-pad" style={{marginTop:20}}><h2 className="section-title">What clients say</h2><div className="grid grid-2">{[['“Samuel was precise, tidy and finished ahead of schedule.”','Amina Yusuf · Nook & Form'],['“I would happily recommend him for any residential electrical work.”','Kola Bello · Kola Build Co.']].map(x=><div style={{padding:18,background:'var(--lav)',borderRadius:9}} key={x[1]}><div className="rating">★★★★★</div><p style={{lineHeight:1.6}}>{x[0]}</p><small className="muted">{x[1]}</small></div>)}</div></div></> }

function Payments({setPage}) { return <><div className="page-head"><div><div className="eyebrow">Your money, clearly</div><h1>Payments</h1><p>Track every naira from agreed scope to paid.</p></div><Button onClick={()=>setPage('dashboard')}>Back to dashboard</Button></div><div className="stats"><div className="card stat"><div className="eyebrow">Available to withdraw</div><div className="number">₦240k</div><div className="trend">Ready in your Craft balance</div></div><div className="card stat"><div className="eyebrow">This month</div><div className="number">₦380k</div><div className="trend">↑ 24% vs last month</div></div><div className="card stat"><div className="eyebrow">In progress</div><div className="number">₦150k</div><div className="trend">1 active project</div></div></div><div className="card"><div className="card-pad" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><h2 className="section-title" style={{margin:0}}>Payment history</h2><Button kind="secondary">Download statement</Button></div>{[['Electrical fit-out · milestone 2','Arcline Homes','₦150,000','Processing','amber'],['Villa repainting project · final','Musa Developments','₦240,000','Paid · 12 Aug','green'],['Kitchen tiling · deposit','Nook & Form','₦90,000','Paid · 04 Aug','green'],['Solar installation · final','Ade Homes','₦180,000','Paid · 21 Jul','green']].map(x=><div className="list-row" style={{padding:'18px 22px'}} key={x[0]}><div><strong>{x[0]}</strong><div className="muted" style={{marginTop:5,fontSize:12}}>{x[1]}</div></div><div style={{display:'flex',alignItems:'center',gap:22}}><b>{x[2]}</b><span className={`tag ${x[4]}`}>{x[3]}</span><a className="link" onClick={()=>setPage('receipt')}>View receipt</a></div></div>)}</div></> }

function Workspace({setPage}) { return <><div className="page-head"><div><div className="eyebrow">Active project</div><h1>Villa repainting project</h1><p>Musa Developments · Lekki Phase 1, Lagos</p></div><span className="tag green">On track</span></div><div className="grid grid-2"><div className="card card-pad"><div className="page-head" style={{marginBottom:10}}><h2 className="section-title">Project progress</h2><b style={{color:'var(--purple)'}}>70%</b></div><div className="progress-track"><div className="progress-value" style={{width:'70%'}}></div></div><div className="timeline" style={{marginTop:28}}>{[['Site preparation','Completed · 08 Aug'],['Surface repairs','Completed · 10 Aug'],['Primer & first coat','In progress · Due 15 Aug'],['Final coat & handover','Upcoming · 18 Aug']].map((x,i)=><div className="timeline-item" key={x[0]}><strong>{x[0]} {i<2&&<span style={{color:'var(--green)',fontSize:12}}>✓</span>}</strong><small>{x[1]}</small></div>)}</div><div style={{display:'flex',gap:10,marginTop:10}}><Button onClick={()=>setPage('completion')}>Mark as completed</Button><Button kind="secondary" onClick={()=>setPage('messages')}>Message client</Button></div></div><div className="card card-pad"><div className="eyebrow">Project agreement</div><div className="summary-line"><span>Agreed budget</span><b>₦240,000</b></div><div className="summary-line"><span>Start date</span><b>05 August 2024</b></div><div className="summary-line"><span>Payment status</span><span className="tag green">₦150k paid</span></div><hr style={{border:0,borderTop:'1px solid var(--line)',margin:'20px 0'}}/><div className="message-row"><div className="user-avatar">MD</div><div><strong>Musa Developments</strong><small>Client · Usually replies in 1 hour</small></div></div><Button kind="secondary" onClick={()=>setPage('messages')} style={{width:'100%',marginTop:20}}>Open conversation</Button></div></div></> }

function Completion({setPage}) { return <div className="card form-card" style={{margin:'0 auto'}}><div className="eyebrow">One last step</div><h1>Ready to hand over?</h1><p className="form-help">Let the client know the work is complete. They’ll review the project before the final payment is released.</p><div className="field"><label>Completion note</label><textarea rows="5" placeholder="Share a quick note about what was completed..."></textarea></div><div className="field"><label>Add final photos <span className="muted">(optional)</span></label><Button kind="secondary">＋ Upload photos</Button></div><div className="form-actions"><Button kind="ghost" onClick={()=>setPage('workspace')}>Cancel</Button><Button onClick={()=>setPage('completion-success')}>Submit completion <span>→</span></Button></div></div> }
function CompletionSuccess({setPage}) { return <div className="card success"><div className="success-mark">✓</div><div className="eyebrow" style={{marginTop:22}}>Handover submitted</div><h1>Great work, Samuel.</h1><p>Musa Developments has been notified. We’ll let you know when they confirm completion and release the final payment.</p><div style={{display:'flex',justifyContent:'center',gap:10,marginTop:24}}><Button onClick={()=>setPage('portfolio-add')}>Add this work to portfolio</Button><Button kind="secondary" onClick={()=>setPage('dashboard')}>Back to dashboard</Button></div></div> }

function Forgot({go}) { return <div className="auth"><div className="auth-side"><Logo/><div><div className="eyebrow" style={{color:'#e5cfee'}}>No worries</div><h1>We’ll get you back to your work.</h1><p>Reset your password securely and return to your Craft workspace.</p></div><div className="quote">Your account and work stay protected.</div></div><div className="auth-form"><div className="eyebrow">Account recovery</div><h2>Forgot your password?</h2><p className="form-help">Enter your email and we’ll send a reset link.</p><div className="field"><label>Email address</label><input placeholder="you@example.com"/></div><Button onClick={()=>go('reset')}>Send reset link <span>→</span></Button><div className="auth-footer"><a onClick={()=>go('login')}>← Back to login</a></div></div></div> }
function Reset({go}) { return <div className="auth"><div className="auth-side"><Logo/><div><div className="eyebrow" style={{color:'#e5cfee'}}>Almost there</div><h1>Set a password only you know.</h1><p>Choose something strong and memorable to keep your Craft account safe.</p></div><div className="quote">You can always update this in Settings.</div></div><div className="auth-form"><div className="eyebrow">Account recovery</div><h2>Create a new password</h2><p className="form-help">Your reset link is valid for the next 30 minutes.</p><div className="field"><label>New password</label><input type="password" placeholder="At least 8 characters"/></div><div className="field"><label>Confirm password</label><input type="password" placeholder="Repeat your password"/></div><Button onClick={()=>go('login')}>Reset password <span>✓</span></Button></div></div> }

function App(){const [page,setPage]=useState('landing'); const go=p=>setPage(p); if(page==='landing')return <Landing go={go}/>; if(['signup','login'].includes(page))return <Auth mode={page} go={go}/>; if(page==='verify')return <Verify go={go}/>; if(page==='forgot')return <Forgot go={go}/>; if(page==='reset')return <Reset go={go}/>; if(page==='onboarding')return <div style={{minHeight:'100vh',padding:'48px 30px',background:'var(--bg)'}}><div style={{maxWidth:1100,margin:'auto'}}><Logo/><div style={{marginTop:44}}><Onboarding setPage={go}/></div></div></div>; let inner=page==='dashboard'?<Dashboard setPage={go}/>:page==='project-feed'?<ProjectFeed setPage={go}/>:page==='project-details'?<ProjectDetails setPage={go}/>:page==='apply'?<Apply setPage={go}/>:page==='application-success'?<ApplicationSuccess setPage={go}/>:page==='applications'?<Applications setPage={go}/>:page==='messages'?<Messages setPage={go}/>:page==='portfolio'?<Portfolio setPage={go}/>:page==='portfolio-add'?<PortfolioAdd setPage={go}/>:page==='my-profile'?<Profile setPage={go}/>:page==='profile-edit'?<ProfileEdit setPage={go}/>:page==='reviews'?<Reviews setPage={go}/>:page==='payments'?<Payments setPage={go}/>:page==='workspace'?<Workspace setPage={go}/>:page==='completion'?<Completion setPage={go}/>:page==='completion-success'?<CompletionSuccess setPage={go}/>:page==='receipt'?<Payments setPage={go}/>:<Dashboard setPage={go}/>; return <Shell page={page} setPage={go}>{inner}</Shell> }
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
