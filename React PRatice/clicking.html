<!DOCTYPE html>
<html>
  <head>
    <title> Clicked Button </title>
  </head>
  <body>


    <div class="js-container"></div>

 


    <script src="https://unpkg.com/supersimpledev/react.js"></script>

    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>


    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>





    <script src="https://unpkg.com/supersimpledev/babel.js"></script>



    <script type="text/babel">  
    
    

    function Thebutton ({ count, setCount }) {


        function click () {
          setCount(count + 1);
        //   alert(count)
        }

        const timeText = count < 1 ?  "times" : "time"


        return (
            <>

            <button
            onClick={click}
            > 
            Clicked {count} {timeText}
            </button>

            

            </>
        );
    }


    function ResetBtn ({ count, setCount }) {

        function reset () {
            setCount(0);
        }


        return (
            <button onClick={reset}> Reset </button>
        )
    }

    
    function AppDisplay() {

        const [count, setCount] = React.useState(0);
        /*
        const count = countArray[0];
        const setCount = countArray[1]
        */

        return (
            <>
            
  
            <div>

                <Thebutton  count={count} 
                            setCount={setCount}
                />
                
            </div>

                <Thebutton  count={count} 
                            setCount={setCount}
                />
            
            <div>

                <ResetBtn   count={count} 
                            setCount={setCount}
                />

            </div>


            </>
        )
       }




      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);

      root.render(<AppDisplay />);
    </script>


  </body>
</html>
