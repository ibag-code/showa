<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>


    <div class="js-container"></div>

 


    <script src="https://unpkg.com/supersimpledev/react.js"></script>

    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>


    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>





    <script src="https://unpkg.com/supersimpledev/babel.js"></script>



    <script type="text/babel">   

    //Input Component
    function ChatInput({ chatMessages, setChatMessages}) {
      
      const theInputTextArray = React.useState("");
      const inputText = theInputTextArray[0];
      const setInputText = theInputTextArray[1];

      function saveInputText (event) {
        setInputText (event.target.value)
      }

      function sendMessage () {
        const newChatMessages =  [
            ...chatMessages,
          {
            id: crypto.randomUUID(),
            message: inputText ,
            sender: "user"
          }
        ]

        setChatMessages(newChatMessages)


        const botResponce = Chatbot.getResponse(inputText)

        setChatMessages([
            ...newChatMessages,
          {
            id: crypto.randomUUID(),
            message: botResponce ,
            sender: "robot"
          }
        ])



        setInputText('');
      }

       return (
        <>
        <input 
          type="text" 
          placeholder="Send a message to Chatbot"  
          size= "50" 
          onChange={saveInputText }
          value = {inputText}  //controlled input
        />
          <button 
          onClick = {sendMessage}
          > 
          Send </button>
        </>
       );
    }



    //Chat Component
    function ChatMessage (props) {
      
      const message = props.message;
      const sender = props.sender;
      

      return (
        <div> 

            {sender === "robot" && <img src="robot.png" alt="user image" width="40" /> }

            {message}

            {sender === "user" &&  <img src="user.png" alt="user image" width="40" />  }


        </div> 
      );
    }    
     
    
    function ChatMessageFrame ({ chatMessages}) {
          
      return(
        <> 

          {chatMessages.map((chatMessage) => {
              return (

                <ChatMessage 
                  key = {chatMessage.id}
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                />
              );
          })}

        </>
      )

    }




    
    function AppDisplay() {


            
          //Converting the data into state
      const chatMessagesArray = React.useState(
        [{
            id: 'id1',
            message: "Hello ChatBot",
            sender: "user"
          },
          {
            id: 'id2',
            message: "Hello! how can i help you?",
            sender: "robot"
          }, 
          {
            id: 'id3',
            message: "Can you get me todays day",
            sender: "user"
          }, 
          {
            id: 'id4',
            message: "Today is September 9",
            sender: "robot"
          }
        ]);
      const chatMessages = chatMessagesArray[0];
      const setChatMessages = chatMessagesArray[1];


        return (
          <>  

              <ChatInput 
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
              />
              <ChatMessageFrame 
              chatMessages={chatMessages}
               />
          </>
        ) 

       }




      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);

      root.render(<AppDisplay />);
    </script>


  </body>
</html>
