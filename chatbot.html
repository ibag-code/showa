<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>


    <div class="js-container"></div>

 


    <script src="https://unpkg.com/supersimpledev/react.js"></script>

    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>





    <script src="https://unpkg.com/supersimpledev/babel.js"></script>



    <script type="text/babel">   

    //Input Component
    function ChatInput() {
       return (
        <>
        <input 
          type="text" 
          placeholder="Send a message to Chatbot"  
          size= "50"
        />
          <button> Send </button>
        </>
       );
    }



    //Chat Component
    function ChatMessage (props) {
      
      const message = props.message;
      const sender = props.sender;
      

      return (
        <div> 

            {sender === "robot" && <img src="robot.png" alt="user image" width="40" /> }

            {message}

            {sender === "user" &&  <img src="user.png" alt="user image" width="40" />  }


        </div> 
      );
    }

    

      const application  = 
        <>  
            {ChatInput()}
            <ChatInput></ChatInput>
            <ChatInput />

            <ChatMessage 
            message="Hello ChatBot" 
            sender="user"
            />

            <ChatMessage 
            message="Hello! how can i help you?" sender="robot"
            />

            <ChatMessage 
            message="Can you get me todays day" sender="user"
            />

            <ChatMessage 
            message="Today is September 9" sender="robot" 
            />

        </>;


      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);

      root.render(application);
    </script>


  </body>
</html>
