<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>


    <div class="js-container"></div>

 


    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>





    <script src="https://unpkg.com/supersimpledev/babel.js"> </script>



    <script type="text/babel">   

        function LoginForm() {
            return (
                <>
                    <div>Hello! welcome to my website</div>
                    


                    <div>
                    <input type="text" name="password" id="password" placeholder="Enter your email address" size="50"/>
                    </div>

                    <div>
                    <input type="password" name="password" id="password" placeholder="Enter your password "  size="50"/>
                    </div>
                    

                    <button> Login </button>
                    <button> Sign Up </button>
                </>
            )
        }

        function App () {
            return (
                <>
                    <div>Hello! welcome to my website</div>

                    <button> Login </button>
                    <button> Sign Up </button>

                </>
            )
        }
    

        function Ecommerce () {
            return (
                <>
                    <div>
                        Cutton Socks
                    </div>
                    <div>
                        Price: $10.99
                    </div>
                    
                    <button> Add to cart</button>
                </>

            );
        }

      
        function ProductDetails ({productname, price, discountprice, image}) {
            /*
            const productName = props.productname;
            const price = props.price
            const discountprice = props.discountprice
            */
            return (
                <>  
                    <div>
                        <img src={image} alt="" width="200" />
                    </div>
                    
                    <div>
                         {productname}
                     </div>

                    <div>
                        {/* If true, renders "Active", otherwise renders "Offline" */}
                        {discountprice ? <del> Price:{price}  </del> : <div> Price:{price} </div> }
                    </div>

                    <div>
                    {discountprice && <div> Discount Price: $5.99 </div>}
                    </div>
                 
                    

                    <button> Add to cart</button>
                </>
            )
        }
      
        const application  = 
        <>  
            <App />
            {LoginForm() }
            <Ecommerce></Ecommerce>

            <ProductDetails productname="Tennis ball" price="$6.90" image="tenniss.jpg" />
            <ProductDetails productname="Cutton Socks" price="$10.99" discountprice image="socks.jpg" />
            <ProductDetails productname="Plain T-Shirt" price="$7.90" image="plain-shirt.jpg" />

        </>;


      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);

      root.render(application);
    </script>


  </body>
</html>
