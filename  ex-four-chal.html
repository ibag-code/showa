<!DOCTYPE html>
<html>
  <head>
    <title> Clicked Button </title>


    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0px;
        }
        .input {
            border: 1px solid rgb(211, 210, 210);
            width: 300px;
            height: 25px;
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 12px;
            background-color: aliceblue;
        }

        .auth {
            padding: 12px 20px;
            background-color: rgb(0, 123, 255);
            color: white;
            margin-right: 6px;
            border: 0px solid rgb(0, 123, 255);
            border-radius: 12px;
        }

        .showBtn {
            margin-left: 10px;
        }




    </style>
  </head>
  <body>


    <div class="js-container"></div>

 


    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>





    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    
    <script type="text/babel"> 

    function TimeSettter () {

    const  Time = dayjs();
    const currentTime = dayjs().format('HH:mm:ss')


    const [isTime, setTime] = React.useState(dayjs().format('HH:mm:ss'));

     React.useEffect( () => {

        setInterval( () => {
            setTime(dayjs().format('HH:mm:ss'))
            console.log('run code ')
        },1000)
        
     }, [])//Dependency array make the code execute once


    return (
        <>
            <p> Current time: {isTime}</p>
        </>
    )


    }






    function Login () {

        const [isShow, setShow] = React.useState(false)

        function showBtn () {
            setShow(!isShow) 
            
        }

        const show = isShow ?  "text" :"password" ;

        console.log(show)
        console.log(isShow)
    return (
        <>
            <p>Hello, Welcome to my website</p>

            <div>
                <input 
                    type="text" 
                    placeholder="Email"
                    className="input" 
                    />
            </div>

            <div>
                <input 
                    type= {show}
                    placeholder="Password"
                    className="input" 
                    />

            <button 
                onClick={showBtn}                   className="showBtn" 
                > Show 
            </button>

        </div>

        
        <button className="auth"> Login </button>
        <button className="auth"> Sign up </button>
        </>
    )
    }





    function Counter() {
    const [count, setCount] = React.useState(0);
    const [isAutoClicking, setIsAutoClicking] = React.useState(false);

    const buttonElement = React.useRef(null);   // 📦 box to hold the counter button

    function handleCount() {
        setCount(count + 1);              // ONLY counts — safe to be "clicked" by code
    }

    function toggleAutoClick() {
        setIsAutoClicking(!isAutoClicking);  // ONLY toggles — never clicked by the interval
    }

    function Reset() {
        setCount(0);
    }

    React.useEffect(() => {
        let intervalId = null;

        if (isAutoClicking) {
        intervalId = setInterval(() => {
            if (buttonElement.current) {
            buttonElement.current.click();   // 🖱️ code clicks the COUNTER button
            }
        }, 1000);
        }

        return () => clearInterval(intervalId);  // 🧹 cleanup outside the if
    }, [isAutoClicking]);


    const autoClick = isAutoClicking ? "Stop Auto Click" : "Auto Click" ;

    
    return (
        <>
        <button
            ref={buttonElement}       // ← ref goes on the COUNTER button
            onClick={handleCount}     // ← so clicking it only counts
        >
            Clicked {count} times
        </button>

        <button onClick={Reset}>Reset</button>

        <button onClick={toggleAutoClick}>
            {autoClick}
        </button>
        </>
    );
    }


    
    function AppDisplay() {


        return (
            <>
                <Login />
                <TimeSettter />
                <Counter />
            </>
        )
       }




      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);

      root.render(<AppDisplay />);
    </script>


  </body>
</html>
